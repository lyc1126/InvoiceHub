name: Windows public-preview NSIS

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Exact public-preview tag to build
        required: true
        type: string

permissions:
  contents: read

jobs:
  package:
    name: SignPath NSIS preview
    runs-on: windows-2025
    timeout-minutes: 60
    steps:
      - name: Require the exact alpha.2 tag
        shell: pwsh
        run: |
          if ('${{ inputs.tag }}' -ne 'v0.3.0-alpha.2') { throw 'Only v0.3.0-alpha.2 is accepted.' }
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.tag }}
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.14.6'
          architecture: x64
      - uses: actions/setup-node@v5
        with:
          node-version: '24'
          cache: pnpm
      - name: Prepare and stage the exact Windows preview resources
        shell: pwsh
        run: |
          corepack enable
          $runtimeRoot = Join-Path $env:RUNNER_TEMP 'invoicehub-public-preview-runtime'
          ./scripts/dev/prepare_windows_runtime.ps1 -OutputRoot $runtimeRoot -PythonManager pymanager
          $env:PYTHONPATH = Join-Path $PWD 'src'
          $stage = python scripts/dev/tauri_windows_preview_stage.py --root $PWD --runtime-dir (Join-Path $runtimeRoot 'python') --source-commit (git rev-parse HEAD) | ConvertFrom-Json
          if (-not $stage.host_manifest_sha256 -or $stage.host_manifest_sha256 -notmatch '^[0-9a-f]{64}$') { throw 'Preview host manifest staging failed.' }
          "INVOICE_HUB_BUNDLE_MANIFEST_SHA256=$($stage.host_manifest_sha256)" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
      - name: Verify tag identity and prepare the hash-locked WebView2 cache
        shell: pwsh
        run: |
          $config = Get-Content docs/release/WINDOWS_PUBLIC_PREVIEW_CONFIG.json -Raw | ConvertFrom-Json
          if ((python -c "import runpy; print(runpy.run_path('src/invoice_hub/version.py')['PRODUCT_VERSION'])") -ne $config.product_version) { throw 'Version drift.' }
          $webview = Join-Path $env:RUNNER_TEMP $config.webview2.file_name
          Invoke-WebRequest -UseBasicParsing -Uri $config.webview2.url -OutFile $webview
          if ((Get-FileHash $webview -Algorithm SHA256).Hash.ToLowerInvariant() -ne $config.webview2.sha256) { throw 'WebView2 hash drift.' }
          "TAURI_WEBVIEW2_BOOTSTRAPPER_PATH=$webview" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
      - name: Build unsigned application and write the deterministic marker
        shell: pwsh
        run: |
          pnpm exec tauri build --config src-tauri/tauri.windows-preview.conf.json --no-bundle
          $exe = 'src-tauri/target/release/invoicehub-desktop.exe'
          $marker = (Get-Content docs/release/WINDOWS_PUBLIC_PREVIEW_CONFIG.json -Raw | ConvertFrom-Json).nsis_marker
          $markerBytes = [Text.Encoding]::ASCII.GetBytes("`n$marker`n")
          $before = [IO.File]::ReadAllBytes($exe)
          $count = 0
          for ($index = 0; $index -le $before.Length - $markerBytes.Length; $index++) {
            if ([System.Linq.Enumerable]::SequenceEqual([byte[]]$before[$index..($index + $markerBytes.Length - 1)], [byte[]]$markerBytes)) { $count++ }
          }
          if ($count -ne 0) { throw 'NSIS marker must be absent before its single deterministic write.' }
          [IO.File]::AppendAllText($exe, "`n$marker`n", [Text.Encoding]::ASCII)
          $after = [Text.Encoding]::ASCII.GetString([IO.File]::ReadAllBytes($exe))
          if (($after.Split($marker).Count - 1) -ne 1) { throw 'NSIS marker count is invalid after write.' }
      - name: Sign the application executable with SignPath
        uses: SignPath/github-action-submit-signing-request@v1.1
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          project-slug: ${{ vars.SIGNPATH_PROJECT_SLUG }}
          signing-policy-slug: ${{ vars.SIGNPATH_SIGNING_POLICY_SLUG }}
          artifact-configuration-slug: ${{ vars.SIGNPATH_APPLICATION_ARTIFACT_CONFIGURATION_SLUG }}
          input-artifact-path: src-tauri/target/release/invoicehub-desktop.exe
          output-artifact-path: src-tauri/target/release/invoicehub-desktop.exe
      - name: Bundle NSIS without Tauri signing and verify main executable bytes
        shell: pwsh
        run: |
          $before = (Get-FileHash src-tauri/target/release/invoicehub-desktop.exe -Algorithm SHA256).Hash
          pnpm exec tauri bundle --config src-tauri/tauri.windows-preview.conf.json --bundles nsis --no-sign
          $inside = 'src-tauri/target/release/bundle/nsis/invoicehub-desktop.exe'
          if ((Get-FileHash $inside -Algorithm SHA256).Hash -ne $before) { throw 'Packaged EXE differs from the signed EXE.' }
      - name: Sign the outer NSIS installer with SignPath
        uses: SignPath/github-action-submit-signing-request@v1.1
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          project-slug: ${{ vars.SIGNPATH_PROJECT_SLUG }}
          signing-policy-slug: ${{ vars.SIGNPATH_SIGNING_POLICY_SLUG }}
          artifact-configuration-slug: ${{ vars.SIGNPATH_INSTALLER_ARTIFACT_CONFIGURATION_SLUG }}
          input-artifact-path: src-tauri/target/release/bundle/nsis/InvoiceHub_0.3.0-alpha.2_x64-setup.exe
          output-artifact-path: dist/InvoiceHub-v0.3.0-alpha.2-windows-x64-setup.exe
      - name: Verify SignPath outputs and write immutable release evidence
        shell: pwsh
        run: |
          $config = Get-Content docs/release/WINDOWS_PUBLIC_PREVIEW_CONFIG.json -Raw | ConvertFrom-Json
          if ($config.sha256_name -ne "$($config.artifact_name).sha256") { throw 'Preview SHA-256 sidecar name is invalid.' }
          $app = 'src-tauri/target/release/invoicehub-desktop.exe'
          $packagedApp = 'src-tauri/target/release/bundle/nsis/invoicehub-desktop.exe'
          $artifact = Join-Path $PWD "dist/$($config.artifact_name)"
          $appSha256 = (Get-FileHash $app -Algorithm SHA256).Hash.ToLowerInvariant()
          if ((Get-FileHash $packagedApp -Algorithm SHA256).Hash.ToLowerInvariant() -ne $appSha256) { throw 'Packaged EXE differs from the SignPath-signed application after outer signing.' }
          foreach ($candidate in @(@{ Path = $app; Label = 'application' }, @{ Path = $artifact; Label = 'installer' })) {
            $signature = Get-AuthenticodeSignature -FilePath $candidate.Path
            if ($signature.Status -ne 'Valid') { throw "SignPath $($candidate.Label) signature is not valid: $($signature.Status)" }
          }
          $artifactSha256 = (Get-FileHash $artifact -Algorithm SHA256).Hash.ToLowerInvariant()
          $checksumPath = Join-Path $PWD "dist/$($config.sha256_name)"
          $checksumLine = "$artifactSha256  $($config.artifact_name)`n"
          [IO.File]::WriteAllText($checksumPath, $checksumLine, [Text.Encoding]::ASCII)
          if ([IO.File]::ReadAllText($checksumPath, [Text.Encoding]::ASCII) -ne $checksumLine) { throw 'Preview SHA-256 sidecar write failed.' }
          $sourceCommit = (git rev-parse HEAD).Trim().ToLowerInvariant()
          if ($sourceCommit -notmatch '^[0-9a-f]{40}$') { throw 'Preview source commit is invalid.' }
          $receipt = [ordered]@{
            schema_version = 1; product_version = $config.product_version; package_id = $config.package_id
            artifact_name = $config.artifact_name; artifact_sha256 = $artifactSha256
            signed_application_sha256 = $appSha256; webview2_sha256 = $config.webview2.sha256
            uninstall_signed = $false; updater_enabled = $false; source_commit = $sourceCommit
          }
          $receipt | ConvertTo-Json -Depth 5 | Set-Content -LiteralPath (Join-Path $PWD "dist/$($config.receipt_name)") -Encoding UTF8
      - uses: actions/upload-artifact@v7
        with:
          name: InvoiceHub-v0.3.0-alpha.2-windows-x64-setup
          path: |
            dist/InvoiceHub-v0.3.0-alpha.2-windows-x64-setup.exe
            dist/InvoiceHub-v0.3.0-alpha.2-windows-x64-setup.exe.sha256
            dist/InvoiceHub-v0.3.0-alpha.2-windows-x64-setup.build-receipt.json
          if-no-files-found: error
