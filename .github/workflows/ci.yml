name: CI

on:
  pull_request:
  push:
    branches:
      - main
      - "codex/**"

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows:
    name: Windows Python and release contracts
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: "3.14.6"
          architecture: x64
          cache: pip
          cache-dependency-path: |
            requirements/windows-x64-py314.lock
            requirements/test-tools-py314.lock
      - name: Install hash-locked dependencies
        run: >-
          python -m pip install
          --require-hashes
          --only-binary=:all:
          -r requirements/windows-x64-py314.lock
          -r requirements/test-tools-py314.lock
      - name: Run Python, JavaScript, release, and documentation gates
        shell: pwsh
        run: ./scripts/dev/run_tests.ps1
      - name: Parse every PowerShell source file
        shell: pwsh
        run: |
          $failed = $false
          Get-ChildItem -Recurse -File -Include *.ps1,*.psm1 | ForEach-Object {
            $tokens = $null
            $errors = $null
            [System.Management.Automation.Language.Parser]::ParseFile($_.FullName, [ref]$tokens, [ref]$errors) | Out-Null
            if ($errors.Count -gt 0) {
              $failed = $true
              $errors | ForEach-Object { Write-Error "$($_.Extent.File):$($_.Extent.StartLineNumber): $($_.Message)" }
            }
          }
          if ($failed) { throw "PowerShell parser found errors." }
      - name: Verify clean release source identity
        shell: pwsh
        run: |
          $versionOutput = @(
            python -c "import runpy; print(runpy.run_path('src/invoice_hub/version.py')['PRODUCT_VERSION'])"
          )
          if ($LASTEXITCODE -ne 0 -or $versionOutput.Count -ne 1) {
            throw "Could not read PRODUCT_VERSION from src/invoice_hub/version.py."
          }
          $version = ([string]$versionOutput[0]).Trim()
          if ([string]::IsNullOrWhiteSpace($version)) {
            throw "PRODUCT_VERSION from src/invoice_hub/version.py is empty."
          }
          ./scripts/dev/verify_release_source.ps1 `
            -Version $version `
            -PythonVersion 3.14.6 `
            -SourceCommit $env:GITHUB_SHA
      - name: Check whitespace
        run: git diff --check

  macos:
    name: macOS ARM64 Python and release static checks
    runs-on: macos-15
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: "3.14.6"
          architecture: arm64
          cache: pip
          cache-dependency-path: |
            requirements/macos-arm64-py314.lock
            requirements/test-tools-py314.lock
      - name: Assert Apple Silicon runner
        run: test "$(uname -m)" = "arm64"
      - name: Install hash-locked dependencies
        run: >-
          python -m pip install
          --require-hashes
          --only-binary=:all:
          -r requirements/macos-arm64-py314.lock
          -r requirements/test-tools-py314.lock
      - name: Run Python tests and compile sources
        run: |
          PYTHONPATH="$PWD/src" python -m pytest
          python -m compileall src tests
      - name: Run JavaScript syntax checks and interaction tests
        run: |
          find web/static/js -name '*.js' -print0 | xargs -0 -n1 node --check
          node --test tests/*.test.cjs
      - name: Check release shell syntax and repository whitespace
        run: |
          bash -n macos/InvoiceHubMac/script/*.sh
          git diff --check

  lint:
    name: Python static analysis
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: "3.14.6"
      - name: Install hash-locked lint tools
        run: >-
          python -m pip install
          --require-hashes
          --only-binary=:all:
          -r requirements/lint-tools-py314.lock
      - name: Run ruff
        run: ruff check src tests scripts

  rust:
    name: Tauri host Rust (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-15
            clippy_flags: "-D warnings"
          # cfg(windows) code has never been linted; report its warnings without
          # blocking until ENG-01 clears them, then switch this to -D warnings.
          - os: windows-latest
            clippy_flags: ""
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    defaults:
      run:
        working-directory: src-tauri
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      # rust-toolchain.toml pins the channel, components and targets; rustup >= 1.28
      # no longer installs it implicitly, so install it explicitly.
      - name: Install the pinned Rust toolchain
        run: rustup toolchain install
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            src-tauri/target
          key: rust-${{ runner.os }}-${{ hashFiles('rust-toolchain.toml', 'src-tauri/Cargo.lock') }}
      - name: Check formatting
        run: cargo fmt --check
      - name: Run clippy
        run: cargo clippy --locked --all-targets -- ${{ matrix.clippy_flags }}
      - name: Run unit and contract tests
        run: cargo test --locked

  frontend:
    name: Workspace frontend (Vue)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v5
        with:
          node-version: "24"
      - name: Install the pinned pnpm and locked dependencies
        run: |
          corepack enable
          pnpm install --frozen-lockfile
      - name: Type-check
        run: pnpm run typecheck
      - name: Run component tests
        run: pnpm test
      # web/static/app is committed so release packaging ships web/ unchanged;
      # rebuilding must reproduce it byte for byte.
      - name: Verify the committed build is current
        run: |
          pnpm run build
          git status --porcelain -- ../web/static/app
          test -z "$(git status --porcelain -- ../web/static/app)"
