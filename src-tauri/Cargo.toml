[package]
name = "invoicehub-desktop"
version = "0.3.0-alpha.1"
description = "InvoiceHub Tauri desktop host"
license = "AGPL-3.0-or-later"
repository = "https://github.com/lyc1126/InvoiceHub"
edition = "2021"
rust-version = "1.85"
publish = false
build = "build.rs"

[build-dependencies]
tauri-build = { version = "=2.6.3", features = [] }

[dependencies]
tauri = { version = "=2.11.5", features = ["tray-icon"] }
tauri-plugin-single-instance = { version = "=2.4.3", features = [] }
tauri-plugin-dialog = { version = "=2.7.2", features = [] }
tauri-plugin-opener = { version = "=2.5.4", features = [] }
tauri-plugin-updater = { version = "=2.10.1", features = [] }
getrandom = { version = "=0.3.4", features = [] }
serde_json = { version = "=1.0.151", features = [] }
hmac = { version = "=0.12.1", features = [] }
sha2 = { version = "=0.10.9", features = [] }
