[package]
name = "invoicehub-desktop"
version = "0.3.0-alpha.2"
description = "InvoiceHub Tauri desktop host"
license = "AGPL-3.0-or-later"
repository = "https://github.com/lyc1126/InvoiceHub"
edition = "2021"
rust-version = "1.85"
publish = false
build = "build.rs"

[build-dependencies]
tauri-build = { version = "=2.6.3", features = [] }

[dependencies]
tauri = { version = "=2.11.5", features = ["tray-icon"] }
tauri-plugin-single-instance = { version = "=2.4.3", features = [] }
tauri-plugin-dialog = { version = "=2.7.2", features = [] }
tauri-plugin-opener = { version = "=2.5.4", features = [] }
tauri-plugin-updater = { version = "=2.10.1", features = [] }
getrandom = { version = "=0.3.4", features = [] }
serde_json = { version = "=1.0.151", features = [] }
hmac = { version = "=0.12.1", features = [] }
sha2 = { version = "=0.10.9", features = [] }
png = { version = "=0.17.16", features = [] }

[target.'cfg(unix)'.dependencies]
libc = { version = "=0.2.189", features = [] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "=0.61.2", features = [
    "Win32_Foundation",
    "Win32_Storage_FileSystem",
    "Win32_System_IO",
    "Win32_NetworkManagement_IpHelper",
    "Win32_Networking_WinSock",
    "Win32_System_Threading",
    "Win32_System_Diagnostics_ToolHelp",
    "Win32_UI_WindowsAndMessaging",
] }
