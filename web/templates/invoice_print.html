<!doctype html>
<html lang="zh-CN">
<head>
  <title>发票打印</title>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <style>
    :root {
      color-scheme: light;
      font-family: "Microsoft YaHei", "Segoe UI", sans-serif;
    }
    * { box-sizing: border-box; }
    html, body { min-height: 100%; }
    body {
      margin: 0;
      background: #e8edf3;
      color: #172033;
    }
    button {
      min-height: 44px;
      padding: 8px 14px;
      border: 1px solid #a9b5c6;
      border-radius: 6px;
      background: #fff;
      color: #172033;
      font: inherit;
      font-weight: 700;
      cursor: pointer;
    }
    button:hover:not(:disabled) { border-color: #2563eb; color: #1748a6; }
    button:focus-visible { outline: 3px solid rgba(37, 99, 235, 0.36); outline-offset: 2px; }
    button:disabled { cursor: not-allowed; opacity: 0.56; }
    .print-toolbar {
      position: sticky;
      top: 0;
      z-index: 10;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      min-height: 68px;
      padding: 10px 18px;
      border-bottom: 1px solid #cbd5e1;
      background: rgba(255, 255, 255, 0.97);
      box-shadow: 0 2px 10px rgba(15, 23, 42, 0.1);
    }
    .print-status { min-width: 0; }
    .print-status strong,
    .print-status span { display: block; }
    .print-status strong { font-size: 16px; line-height: 1.35; }
    .print-status span {
      margin-top: 3px;
      color: #5a6779;
      font-size: 13px;
      line-height: 1.45;
    }
    .print-actions { display: flex; flex: 0 0 auto; gap: 8px; }
    .print-again {
      border-color: #1d4ed8;
      background: #2563eb;
      color: #fff;
    }
    .print-again:hover:not(:disabled) { border-color: #1e40af; background: #1d4ed8; color: #fff; }
    .print-error {
      margin: 18px auto 0;
      width: min(760px, calc(100% - 32px));
      padding: 12px 14px;
      border: 1px solid #fecaca;
      border-left: 4px solid #dc2626;
      border-radius: 6px;
      background: #fff7f7;
      color: #7f1d1d;
      line-height: 1.55;
    }
    .print-pages {
      display: grid;
      gap: 22px;
      padding: 22px;
    }
    .print-sheet {
      position: relative;
      width: min(1180px, calc(100vw - 44px));
      margin: 0 auto;
      overflow: hidden;
      background: #fff;
      box-shadow: 0 5px 22px rgba(15, 23, 42, 0.18);
    }
    .print-sheet--landscape { aspect-ratio: 297 / 210; }
    .print-sheet--portrait { width: min(820px, calc(100vw - 44px)); aspect-ratio: 210 / 297; }
    .print-sheet img {
      display: block;
      width: 100%;
      height: 100%;
      object-fit: contain;
      background: #fff;
    }
    @page invoice-landscape { size: landscape; margin: 0; }
    @page invoice-portrait { size: portrait; margin: 0; }
    @media print {
      html, body, main { width: 100%; height: 100%; min-height: 0; margin: 0; padding: 0; background: #fff; }
      .print-toolbar,
      .print-error { display: none !important; }
      .print-pages { display: block; padding: 0; }
      .print-sheet {
        width: 100%;
        height: 100%;
        margin: 0;
        border: 0;
        box-shadow: none;
        break-inside: avoid;
        page-break-inside: avoid;
        break-after: auto;
        page-break-after: auto;
      }
      .print-sheet + .print-sheet {
        break-before: page;
        page-break-before: always;
      }
      .print-sheet--landscape {
        page: invoice-landscape;
      }
      .print-sheet--portrait {
        page: invoice-portrait;
      }
    }
    @media (max-width: 640px) {
      .print-toolbar { align-items: stretch; flex-direction: column; padding: 12px; }
      .print-actions { width: 100%; }
      .print-actions button { flex: 1 1 0; min-width: 0; }
      .print-pages { gap: 12px; padding: 12px; }
      .print-sheet,
      .print-sheet--portrait { width: 100%; }
    }
  </style>
</head>
<body>
  <header class="print-toolbar">
    <div class="print-status" role="status" aria-live="polite" aria-atomic="true">
      <strong id="printStatusTitle">正在准备发票票面</strong>
      <span id="printStatusDetail">加载完成后将打开浏览器打印对话框。</span>
    </div>
    <div class="print-actions">
      <button id="printAgainBtn" class="print-again" type="button" disabled>打开打印对话框</button>
      <button id="closePrintBtn" type="button">关闭</button>
    </div>
  </header>
  <div id="printError" class="print-error" role="alert" hidden></div>
  <main id="printPages" class="print-pages" aria-label="待打印发票票面"></main>

  <script>
    const printJob = {{PRINT_JOB_JSON}};
    const printRefs = {
      title: document.getElementById("printStatusTitle"),
      detail: document.getElementById("printStatusDetail"),
      error: document.getElementById("printError"),
      pages: document.getElementById("printPages"),
      printAgain: document.getElementById("printAgainBtn"),
      close: document.getElementById("closePrintBtn"),
    };
    let printReady = false;
    let beforePrintObserved = false;

    function showPrintError(message) {
      printRefs.title.textContent = "无法打开打印";
      printRefs.detail.textContent = "请处理提示后返回首页重试。";
      printRefs.error.textContent = message;
      printRefs.error.hidden = false;
    }

    async function waitForImage(image) {
      if (!image.complete) {
        await new Promise((resolve, reject) => {
          image.addEventListener("load", resolve, { once: true });
          image.addEventListener("error", reject, { once: true });
        });
      }
      if (image.naturalWidth <= 0) throw new Error("image unavailable");
      if (typeof image.decode === "function") await image.decode();
    }

    function waitForPrintableFrame() {
      return new Promise((resolve) => {
        window.requestAnimationFrame(() => {
          window.requestAnimationFrame(resolve);
        });
      });
    }

    function requestBrowserPrint() {
      if (!printReady) return;
      if (typeof window.print !== "function") {
        showPrintError("当前浏览器不提供打印功能，请改用最新版 Chrome 或 Edge 后重试。");
        return;
      }
      beforePrintObserved = false;
      printRefs.title.textContent = "正在打开浏览器打印对话框";
      printRefs.detail.textContent = `共 ${printJob.invoice_count} 张发票、${printJob.page_count} 页。`;
      try {
        window.print();
        window.setTimeout(() => {
          if (!beforePrintObserved) {
            showPrintError("浏览器没有确认已打开打印对话框。请点击“打开打印对话框”重试，或改用最新版 Chrome / Edge。");
          }
        }, 100);
      } catch (_error) {
        showPrintError("浏览器拒绝打开打印对话框。请检查浏览器打印权限，或改用最新版 Chrome / Edge。");
      }
    }

    async function preparePrintPages() {
      const pages = Array.isArray(printJob.pages) ? printJob.pages : [];
      if (!pages.length) {
        showPrintError("打印作业没有可用票面，请返回首页重新勾选。");
        return;
      }
      const images = pages.map((page) => {
        const sheet = document.createElement("section");
        const orientation = page.orientation === "portrait" ? "portrait" : "landscape";
        sheet.className = `print-sheet print-sheet--${orientation}`;
        sheet.setAttribute("aria-label", `发票 ${page.invoice_index}，原文件第 ${page.source_page_number} 页`);
        const image = document.createElement("img");
        image.src = page.image_url;
        image.alt = `发票 ${page.invoice_index}，原文件第 ${page.source_page_number} 页`;
        image.decoding = "async";
        sheet.append(image);
        printRefs.pages.append(sheet);
        return image;
      });
      try {
        await Promise.all(images.map(waitForImage));
        await waitForPrintableFrame();
        printReady = true;
        printRefs.printAgain.disabled = false;
        printRefs.title.textContent = "发票票面已准备完成";
        printRefs.detail.textContent = `共 ${printJob.invoice_count} 张发票、${printJob.page_count} 页，正在打开打印对话框。`;
        requestBrowserPrint();
      } catch (_error) {
        showPrintError("票面加载失败，打印作业可能已过期。请关闭本页，刷新发票列表后重新勾选。");
      }
    }

    window.addEventListener("beforeprint", () => {
      beforePrintObserved = true;
      printRefs.title.textContent = "浏览器打印对话框已打开";
    });
    window.addEventListener("afterprint", () => {
      printRefs.title.textContent = "打印对话框已关闭";
      printRefs.detail.textContent = "如需再次打印，请点击“打开打印对话框”。";
    });
    printRefs.printAgain.addEventListener("click", requestBrowserPrint);
    printRefs.close.addEventListener("click", () => window.close());
    preparePrintPages();
  </script>
</body>
</html>
